name: LMS Bot Poll

on:
  schedule:
    - cron: '0 8,10,12,14,16,18,20,22 * * 2,4'
    - cron: '0 8,13,18,23 * * 0,1,3,5,6'
  workflow_dispatch: {}
  repository_dispatch:
    types: [check_course]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check kill switch
        id: control
        run: |
          if [ -f bot_control.json ] && ! grep -q '"enabled": true' bot_control.json; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Bot is paused via bot_control.json — skipping this run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.control.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.control.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Restore cached session cookies
        if: steps.control.outputs.enabled == 'true'
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: |
          if [ -n "$COOKIES_JSON" ]; then
            echo "$COOKIES_JSON" > cookies.json
          fi

      - name: Cache Playwright browsers
        if: steps.control.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + system dependencies
        if: steps.control.outputs.enabled == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run scheduled full sweep
        if: steps.control.outputs.enabled == 'true' && github.event_name != 'repository_dispatch'
        env:
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Run on-demand single-course check
        if: steps.control.outputs.enabled == 'true' && github.event_name == 'repository_dispatch'
        env:
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py \
            --course "${{ github.event.client_payload.course }}" \
            --chat-id "${{ github.event.client_payload.chat_id }}"

      - name: Persist fresh session cookies
        if: steps.control.outputs.enabled == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f cookies.json ] && [ -n "$GH_TOKEN" ]; then
            gh secret set COOKIES_JSON --repo "${{ github.repository }}" --body-file=cookies.json
          fi

      - name: Commit updated state.json & filter configs
        if: steps.control.outputs.enabled == 'true' && success()
        run: |
          git config user.name "lms-bot"
          git config user.email "lms-bot@users.noreply.github.com"
          git add state.json blocked_log.json filter_config.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update state and logs [skip ci]"
            git pull --rebase
            git push
          fi