name: VIT LMS Poller

on:
  schedule:
    # Tue/Thu: every 2h, 8 AM - 10 PM IST 
    - cron: '30 2,4,6,8,10,12,14,16 * * 2,4'
    # Other days: every 5h, 8 AM - 11 PM IST
    - cron: '30 2,7,12,17 * * 0,1,3,5,6'
  workflow_dispatch: {}

jobs:
  poll-lms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 python-dotenv python-telegram-bot pdfplumber python-docx google-generativeai

      - name: Reconstruct cookies.json
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: echo "$COOKIES_JSON" > cookies.json

      - name: Run LMS Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit state.json back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update state.json from automated run" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
